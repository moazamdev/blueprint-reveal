<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blueprint Reveal demo</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>body{font:15px/1.6 system-ui;background:#f9fbf7;color:#263322;margin:0;padding:40px}main{max-width:840px;margin:auto}h1{font-size:28px}section{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:45px}.card{padding:28px;background:white;border-radius:12px;box-shadow:0 4px 18px #29342312;min-height:290px}h2{font-size:23px;font-weight:500;margin:0 0 15px}p{margin:0 0 16px}svg{display:block;width:100%;height:100px;margin:15px 0}.live-button{margin-top:12px}#result{min-height:24px;font-size:13px;margin-top:15px}@media(max-width:600px){body{padding:22px}section{grid-template-columns:1fr;gap:30px}}</style></head><body><main><h1>Blueprint Reveal</h1><p>Two component factories, shared settings, masked replacement and live controls.</p><section><div data-reveal="trend-card"><article class="card" data-reveal-content><h2>Traffic overview</h2><p>A responsive chart with actual SVG geometry.</p><svg data-part="plot" viewBox="0 0 260 100" aria-label="Traffic line"><g transform="translate(8 5)"><path d="M0 75L30 62L60 68L90 45L120 58L150 22L180 32L210 12L240 20" stroke="#6c9270" stroke-width="2" fill="none"/></g></svg></article></div><div data-reveal="note-card"><article class="card" data-reveal-content><h2>Project notes</h2><p>A paragraph that wraps naturally and keeps its real measured line lengths in the generated blueprint.</p><button class="btn live-button">Try the real button</button><p id="result" role="status"></p></article></div></section></main><script type="module">
import config from '../../codex/blueprint-reveal/assets/blueprint-reveal.config.js';
import {blueprints} from './blueprints.js';
import {mountBlueprintProject} from '../../codex/blueprint-reveal/assets/runtime/project-controller.js';
import {mountRevealControls} from '../../codex/blueprint-reveal/assets/runtime/reveal-controls.js';
const project=mountBlueprintProject({config,blueprints,development:true});
await document.fonts.ready;
project.scan();mountRevealControls(project);
document.querySelector('.live-button').addEventListener('click',()=>{document.querySelector('#result').textContent='Live HTML preserved';project.refresh();});
window.addEventListener('pagehide',()=>project.destroy(),{once:true});
</script></body></html>
